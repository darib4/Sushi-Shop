<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <title>My Account</title>
  <link rel="stylesheet" href="../styles/account.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../js/state.js"></script>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>My Account</h1>
      <a href="cart.html" class="cart-icon" id="cartIcon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
    </div>
    <nav class="top-nav">
      <a href="index.html">Catalog</a>
      <a href="admin.html" id="nav-admin" style="display:none">Admin</a>
      <a href="login.html" id="nav-login">Login</a>
      <button id="nav-logout" class="linklike" style="display:none">Logout</button>
    </nav>
  </header>

  <main class="container">
    <section class="card" id="user-card">
      <h2>Profile</h2>
      <div id="user-info"></div>
    </section>

    <section class="card">
      <h2>Orders</h2>
      <div id="orders"></div>
    </section>

    <section class="card">
      <h2>Emails (simulated)</h2>
      <div id="emails"></div>
    </section>

    <section class="card">
      <h2>Transactions (simulated)</h2>
      <div id="transactions"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/init.js"></script>
  <script src="../js/account.js"></script>
  <script src="../js/nav.js"></script>
</body>
</html>
