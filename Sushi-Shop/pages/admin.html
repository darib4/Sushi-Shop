<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="../styles/admin.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/init.js"></script>
</head>
<body>

  <header>
    <div class="header-top">
      <div>
        <h1>Admin Panel</h1>
        <p>Manage products</p>
      </div>
    </div>
    <nav class="top-nav">
      <a href="account.html">Account</a>
      <button id="nav-logout" class="linklike">Logout</button>
    </nav>
  </header>

  <!-- ADD PRODUCT -->
  <section>
    <h2>Add new product</h2>

    <form id="admin-form">

      <input type="text" name="name" placeholder="Product name" required>

      <select name="department" required>
        <option value="">Select department</option>
        <option value="Sushi">Sushi</option>
        <option value="Drinks">Drinks</option>
        <option value="Desserts">Desserts</option>
      </select>

      <select name="category" required>
        <option value="">Select category</option>
        <option value="Classic Rolls">Classic Rolls</option>
        <option value="Special Rolls">Special Rolls</option>
        <option value="Soft Drinks">Soft Drinks</option>
        <option value="Tea">Tea</option>
        <option value="Mochi">Mochi</option>
        <option value="Cheesecake">Cheesecake</option>
      </select>

      <input type="number" step="0.01" name="price" placeholder="Price (BGN)" required>
      <input type="number" name="stock" placeholder="Stock (pcs)" value="20" min="0">
      <input type="text" name="weight" placeholder="Weight (e.g. 250g)">
      <input type="text" name="ingredients" placeholder="Ingredients">

      <button type="submit">Add product</button>
    </form>
  </section>

  <!-- PRODUCT LIST -->
  <section>
    <h2>Existing products</h2>
    <ul id="admin-list">
      <!-- rendered by JS -->
    </ul>
  </section>

  <!-- EDIT MODAL -->
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Product</h2>
        <button type="button" id="cancel-edit" class="close-btn">&times;</button>
      </div>
      
      <form id="edit-form">
        <input type="text" name="name" placeholder="Product name" required>

        <select name="department" required>
          <option value="">Select department</option>
          <option value="Sushi">Sushi</option>
          <option value="Drinks">Drinks</option>
          <option value="Desserts">Desserts</option>
        </select>

        <select name="category" required>
          <option value="">Select category</option>
          <option value="Classic Rolls">Classic Rolls</option>
          <option value="Special Rolls">Special Rolls</option>
          <option value="Soft Drinks">Soft Drinks</option>
          <option value="Tea">Tea</option>
          <option value="Mochi">Mochi</option>
          <option value="Cheesecake">Cheesecake</option>
        </select>

        <input type="number" step="0.01" name="price" placeholder="Price (BGN)" required>
        <input type="number" name="stock" placeholder="Stock (pcs)" min="0">
        <input type="text" name="weight" placeholder="Weight (e.g. 250g)">
        <input type="text" name="ingredients" placeholder="Ingredients">

        <div class="modal-actions">
          <button type="submit">Save Changes</button>
          <button type="button" id="cancel-edit-btn" class="secondary-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- INIT + DATA -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../js/init.js"></script>
  <!-- INIT + DATA -->
  <script src="../js/init.js"></script>
  <script src="../data/sushi.js"></script>
  <script src="../data/drinks.js"></script>
  <script src="../data/desserts.js"></script>
  <script src="../data/data.js"></script>

  <!-- LOGIC -->
  <script src="../js/admin.js"></script>
  <script src="../js/nav.js"></script>

</body>
</html>
