<!DOCTYPE html>
<html lang="bg">
<head>

<body>

<div class="register-container">

  <p>Already have an account? <a href="login.html">Login</a></p>

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="../js/state.js"></script>

</html>
