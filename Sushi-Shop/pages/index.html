<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>Sushi Online Shop</title>
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/init.js"></script>
</head>
<body>

  <header>
    <div class="header-top">
      <div>
        <h1>🍣 Sushi Online Shop</h1>
        <p>Product catalog</p>
      </div>
      <a href="cart.html" class="cart-icon" id="cartIcon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
    </div>
    <nav class="top-nav">
      <a href="index.html">Catalog</a>
      <a href="account.html" id="nav-account">Account</a>
      <a href="admin.html" id="nav-admin" style="display:none">Admin</a>
      <a href="login.html" id="nav-login">Login</a>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </nav>
  </header>

  <!-- SEARCH -->
  <section class="search-section">
    <input
      type="text"
      id="search"
      placeholder="🔍 Search products..."
    >
  </section>

  <!-- FILTERS -->
  <div class="filter-buttons">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="sushi">🍣 Sushi</button>
    <button class="filter-btn" data-filter="drinks">🥤 Drinks</button>
    <button class="filter-btn" data-filter="desserts">🍰 Desserts</button>
  </div>

  <!-- CATALOG -->
  <main id="catalog">
    <!-- products rendered by JS -->
  </main>

  <!-- DATA -->
  <script src="../data/sushi.js"></script>
  <script src="../data/drinks.js"></script>
  <script src="../data/desserts.js"></script>
  <script src="../data/data.js"></script>

  <!-- LOGIC -->
  <script src="../js/catalog.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/nav.js"></script>


</body>
</html>
